name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test

  audit:
    name: Dependency audit (OWASP A06 / L5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Fail the build if any production dependency has a high/critical
      # known vulnerability. Dependabot handles the routine version bumps;
      # this gate stops a known-vulnerable dependency from being merged.
      - run: npm audit --omit=dev --audit-level=high
